<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnamonamour — Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>

    /* =========================================================
       TOKEN DS — LIGHT MODE (default)
       ========================================================= */
    :root,
    [data-theme="light"] {
      --font-serif: 'Philosopher', Georgia, serif;
      --font-sans:  'DM Sans', system-ui, sans-serif;

      --page-bg:          #1c1c2e;
      --app-bg:           #ffedd7;
      --app-header-bg:    #ffedd7;
      --app-footer-bg:    #ffedd7;

      --text-brand:       #460112;
      --text-muted:       rgba(8,15,44,0.6);
      --text-copyright:   rgba(8,15,44,0.50);

      --sep:              rgba(70,1,18,.18);
      --sep-strong:       rgba(70,1,18,.35);

      --card-hover:       rgba(70,1,18,.03);

      --toggle-bg:        rgba(70,1,18,.08);
      --toggle-bg-hover:  rgba(70,1,18,.15);
      --toggle-icon:      #460112;

      --chevron-stroke:   #460112;

      /* Filtro SVG: nessuno in light (colori inline già corretti) */
      --svg-filter: none;
    }

    /* =========================================================
       TOKEN DS — DARK MODE
       Sfondo: #080f2c (bg-text-main, DS-conforme)
       Testo/icone: #ffedd7 (text-light — massimo contrasto, 14:1)
       ========================================================= */
    [data-theme="dark"] {
      --page-bg:          #04040f;
      --app-bg:           #080f2c;
      --app-header-bg:    #06091f;
      --app-footer-bg:    #06091f;

      --text-brand:       #ffedd7;
      --text-muted:       rgba(255,237,215,.48);
      --text-copyright:   rgba(255,237,215,.36);

      --sep:              rgba(255,237,215,.09);
      --sep-strong:       rgba(255,237,215,.16);

      --card-hover:       rgba(255,237,215,.03);

      --toggle-bg:        rgba(255,237,215,.08);
      --toggle-bg-hover:  rgba(255,237,215,.15);
      --toggle-icon:      #ffedd7;

      --chevron-stroke:   #ffedd7;

      /* Filtro che converte il bordeaux (#460112) degli SVG inline → panna (#ffedd7) */
      --svg-filter:
        brightness(0) saturate(100%) invert(97%)
        sepia(10%) saturate(300%) hue-rotate(320deg)
        brightness(103%) contrast(97%);
    }

    /* =========================================================
       RESET + BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--page-bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      transition: background 0.3s ease;
    }

    /* =========================================================
       PHONE FRAME
       ========================================================= */
    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 812px;
      background: var(--app-bg);
      display: flex;
      flex-direction: column;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,0.65);
      transition: background 0.3s ease;
    }

    /* =========================================================
       HEADER
       ========================================================= */
    .menu-header {
      background: var(--app-header-bg);
      padding: 1.375rem 1rem 1.125rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid var(--sep-strong);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .menu-header__logo {
      margin-bottom: 0.5rem;
    }
    .menu-header__logo svg {
      width: 4rem;
      height: 4rem;
      display: block;
      filter: var(--svg-filter);
      transition: filter 0.35s ease;
    }
    .menu-header__title {
      font-family: var(--font-serif);
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--text-brand);
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.01em;
      transition: color 0.3s ease;
    }
    .menu-header__subtitle {
      font-family: var(--font-sans);
      font-size: 0.6875rem;
      font-weight: 400;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.25rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    /* =========================================================
       MAIN
       ========================================================= */
    .menu-main {
      flex: 1;
      padding: 0 1rem 1.5rem;
    }
    .index-eyebrow {
      font-family: var(--font-sans);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 1.25rem 0 0.75rem;
      transition: color 0.3s ease;
    }

    /* =========================================================
       SECTION LIST
       ========================================================= */
    .section-list {
      list-style: none;
      border-top: 1px solid var(--sep);
      transition: border-color 0.3s ease;
    }
    .section-card {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.875rem 0;
      border-bottom: 1px solid var(--sep);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.12s ease, border-color 0.3s ease;
    }
    .section-card:last-child { border-bottom: none; }
    .section-card:hover { background: var(--card-hover); }

    .section-card__icon {
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .section-card__icon svg {
      width: 1.625rem;
      height: 1.625rem;
      /* Recolorazione dark via CSS filter applicato al token --svg-filter */
      filter: var(--svg-filter);
      transition: filter 0.35s ease;
    }
    .section-card__label {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-brand);
      flex: 1;
      line-height: 1.35;
      transition: color 0.3s ease;
    }
    .section-card__chevron {
      flex-shrink: 0;
      opacity: 0.38;
    }
    .section-card__chevron svg {
      width: 0.875rem;
      height: 0.875rem;
      stroke: var(--chevron-stroke);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }

    /* =========================================================
       FOOTER
       ========================================================= */
    .footer-simple {
      background: var(--app-footer-bg);
      border-top: 1px solid var(--sep);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .footer-copyright__text {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-copyright);
      line-height: 1.5;
      transition: color 0.3s ease;
    }

    /* =========================================================
       THEME TOGGLE
       ========================================================= */
    .theme-toggle {
      flex-shrink: 0;
      width: 2.125rem;
      height: 2.125rem;
      border-radius: 50%;
      border: none;
      background: var(--toggle-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.18s ease;
      padding: 0;
    }
    .theme-toggle:hover  { background: var(--toggle-bg-hover); transform: scale(1.08); }
    .theme-toggle:active { transform: scale(0.94); }
    .theme-toggle svg {
      width: 1.05rem;
      height: 1.05rem;
      stroke: var(--toggle-icon);
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }
    /* Sole in light, luna in dark */
    .icon-sun  { display: block; }
    .icon-moon { display: none;  }
    [data-theme="dark"] .icon-sun  { display: none;  }
    [data-theme="dark"] .icon-moon { display: block; }

  </style>
</head>

</div>

<script>
  const toggle = document.getElementById('themeToggle');
  const root   = document.documentElement;

  // Ripristina preferenza salvata (default: light)
  const saved = localStorage.getItem('vtn-theme') || 'light';
  root.setAttribute('data-theme', saved);

  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    localStorage.setItem('vtn-theme', next);
  });
</script>

</body>
